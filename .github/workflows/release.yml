name: Release & Attestation

on:
  push:
    tags:
      - 'v*'

jobs:
  quality-gate:
    name: Pre-Release Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - run: cargo install cargo-audit cargo-deny cargo-geiger
      - run: cargo audit
      - run: cargo deny check
      - run: cargo geiger

  build-and-sign:
    runs-on: ubuntu-latest
    needs: quality-gate
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Build Release
        run: cargo build --release --target x86_64-unknown-linux-musl --bin nusa

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: nusa:${{ github.ref_name }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Sign Binary
        uses: sigstore/cosign-installer@v3
      - run: |
          cosign sign-blob \
            --key env://COSIGN_PRIVATE_KEY \
            --yes \
            target/x86_64-unknown-linux-musl/release/nusa > nusa.sig

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/x86_64-unknown-linux-musl/release/nusa
            nusa.sig
            sbom.spdx.json
          generate_release_notes: true
