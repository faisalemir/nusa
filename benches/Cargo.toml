[package]
name = "nusa-benchmarks"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[[bench]]
name = "gateway_bench"
path = "src/gateway_bench.rs"
harness = false

[[bench]]
name = "ipc_bench"
path = "src/ipc_bench.rs"
harness = false

[[bench]]
name = "cold_start_bench"
path = "src/cold_start_bench.rs"
harness = false

[[bench]]
name = "ipc_latency_bench"
path = "src/ipc_latency_bench.rs"
harness = false

[dependencies]
nusa-core = { path = "../crates/nusa-core" }
nusa-gateway = { path = "../crates/nusa-gateway" }
nusa-ipc = { path = "../crates/nusa-ipc" }
criterion = "0.5"
tokio.workspace = true
bytes.workspace = true
