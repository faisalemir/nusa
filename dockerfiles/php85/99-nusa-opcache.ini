; Nusa runtime — OPcache + JIT defaults (PHP 8.5, P4-C)
; Installed into Alpine php85 conf.d by nusa-test-runner.Dockerfile

[opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; CI image uses bind-mounted /src — revalidate when files change
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.save_comments=1

; PHP 8.5 JIT (tracing — good default for Laravel Octane workers)
opcache.jit=tracing
opcache.jit_buffer_size=128M
opcache.jit_hot_func=127
opcache.jit_hot_loop=64
opcache.jit_hot_return=8
opcache.jit_hot_side_exit=8
